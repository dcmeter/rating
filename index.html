<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nord Cleaning Ratings</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#18212d; --mute:#667085; --line:#e3e7ee; --soft:#f0f3f8;
  --accent:#0b5cad; --accent-soft:#e6f0fa; --bar:#7aa7d6;
  --good:#127a46; --good-bg:#e1f3e8; --ok:#7a6a00; --ok-bg:#faf3cc;
  --warn:#a35a00; --warn-bg:#fdebd0; --bad:#b3261e; --bad-bg:#fbe3e1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f141b; --card:#171f29; --ink:#e8ecf1; --mute:#93a0b0; --line:#2a3441; --soft:#1d2733;
    --accent:#6fb0f0; --accent-soft:#1c2c3f; --bar:#3f6f9f;
    --good:#6fd29a; --good-bg:#16342a; --ok:#e6d26a; --ok-bg:#332f12;
    --warn:#f0b36a; --warn-bg:#392a14; --bad:#f48b83; --bad-bg:#3a1c1a; --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
.hero{background:linear-gradient(135deg,#ffd000,#ffdd33 55%,#ffeb85);color:#18212d;margin:0 -16px 20px;padding:22px 16px 0}
.hero-in{max-width:1180px;margin:0 auto}
.hero h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:2px 0 0;opacity:.85;font-size:13.5px}
.tabs{display:flex;gap:4px;margin-top:16px}
.tab{appearance:none;border:0;background:transparent;color:rgba(24,33,45,.7);font:inherit;font-weight:600;padding:10px 18px;cursor:pointer;border-radius:10px 10px 0 0}
.tab:hover{color:#18212d}
.tab[aria-selected=true]{background:var(--bg);color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2;margin-top:2px}
.kpi .s{font-size:13px;color:var(--mute);margin-top:2px}
.badge{display:inline-block;min-width:46px;text-align:center;border-radius:8px;padding:0 9px;font-weight:700;font-variant-numeric:tabular-nums}
.r-good{background:var(--good-bg);color:var(--good)} .r-ok{background:var(--ok-bg);color:var(--ok)}
.r-warn{background:var(--warn-bg);color:var(--warn)} .r-bad{background:var(--bad-bg);color:var(--bad)} .r-na{color:var(--mute)}
.up{color:var(--good);font-weight:600} .down{color:var(--bad);font-weight:600} .flat{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card);user-select:none}
th[data-k]{cursor:pointer}
th[aria-sort=ascending]::after{content:" ▲"} th[aria-sort=descending]::after{content:" ▼"}
.scroll{overflow-x:auto;max-height:70vh}
.bar{display:flex;align-items:center;gap:10px}
.bar .track{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden;min-width:40px}
.bar .fill{height:100%;background:var(--bar);border-radius:5px}
.muted{color:var(--mute)} .empty{padding:28px;text-align:center;color:var(--mute)}
h2{font-size:16px;margin:0 0 4px} .sub{font-size:13px;color:var(--mute);margin:0 0 12px}
.more{display:block;margin:12px auto 0}
.note{font-size:12px;color:var(--mute);margin-top:12px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:inline-flex;border:1px solid rgba(24,33,45,.4);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:#18212d;font:inherit;font-size:13px;font-weight:600;padding:5px 11px;cursor:pointer;opacity:.8}
.lang button[aria-pressed=true]{background:#18212d;color:#ffd000;opacity:1}
[hidden]{display:none!important}
@media (max-width:600px){
  .hero h1{font-size:20px}.tab{padding:9px 12px}.kpi .v{font-size:26px}
  .bar .track{min-width:28px}.bar{gap:6px}th,td{padding:8px 6px}.hide-sm{display:none}th{white-space:normal;line-height:1.2;vertical-align:bottom}
  td:first-child,th:first-child{white-space:normal}
  .issues th:nth-child(2),.issues td:nth-child(2){display:none}

  /* Low-rated houses: one stacked card per house, nothing hidden */
  .low,.low tbody{display:block}
  .low thead{display:none}
  .low .scroll{max-height:none;overflow:visible}
  .low tr{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:3px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .low tbody tr:last-child{border-bottom:0}
  .low td{display:block;padding:0;border:0;white-space:normal;text-align:left}
  .low td:nth-child(1){grid-row:1;grid-column:1;font-size:16px}
  .low td:nth-child(2){grid-row:1;grid-column:2;color:var(--mute)}
  .low td:nth-child(4){grid-row:1;grid-column:3;text-align:right}
  .low td:nth-child(3){grid-row:2;grid-column:1/3;font-size:13px;color:var(--mute)}
  .low td:nth-child(3)::after{content:" " attr(data-l)}
  .low td:nth-child(5){grid-row:2;grid-column:3;font-size:13px;color:var(--mute);text-align:right}
  .low td:nth-child(6){grid-row:3;grid-column:1/-1;font-size:13.5px;margin-top:2px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div class="hero-in">
    <div class="hero-top"><div><h1 data-i18n="title">Nord Cleaning Ratings</h1><p id="upd">…</p></div>
      <div class="lang" role="group" aria-label="Language"><button id="lEN" aria-pressed="true">EN</button><button id="lDA" aria-pressed="false">DA</button></div></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="vendor" aria-selected="true" data-i18n="tabVendor">Vendor wise</button>
      <button class="tab" role="tab" data-tab="team" aria-selected="false" data-i18n="tabTeam">Team wise</button>
    </div>
  </div></div>

  <div class="panel">
    <div class="filters">
      <div><label for="from" data-i18n="from">From</label><input type="date" id="from"></div>
      <div><label for="to" data-i18n="to">To</label><input type="date" id="to"></div>
      <div id="officeBox" hidden><label for="office" data-i18n="office">Local office</label><select id="office"></select></div>
      <div id="vendorBox"><label for="who">Breezeway ID</label>
        <input id="who" list="whoList" data-i18n-ph="typeSearch" placeholder="Type to search…" autocomplete="off"><datalist id="whoList"></datalist></div>
      <div id="teamBox" hidden><label for="q" data-i18n="searchTeam">Search team member</label>
        <input id="q" data-i18n-ph="typeName" placeholder="Type a name…" autocomplete="off"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="out"></div>
  <p class="note" data-i18n="note">Rating = average guest cleaning rating (1–5) for stays with an arrival date in the selected period. Issue % = share of all reported issues.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- languages ---------- */
const I18N = {
 en:{ title:'Nord Cleaning Ratings', tabVendor:'Vendor wise', tabTeam:'Team wise', from:'From', to:'To', office:'Local office', allOffices:'All offices',
  typeSearch:'Type to search…', searchTeam:'Search team member', typeName:'Type a name…',
  p7:'Last 7 days', p30:'Last 30 days', pMonth:'This month', pLast:'Last month', pAll:'All data',
  sub:'Guest cleaning ratings · data up to {d} · updated {u}',
  kRating:'Your average rating', kRatings:'Ratings received', kIssues:'Issues reported', kNoIssues:'Stays without issues',
  inOffice1:'in {n} office', inOffices:'in {n} offices', perRating:'{x} per rating', ofRatings:'{p} of ratings', vsOffice:'vs office average',
  impactTitle:'Your impact on each office', byOffice:'By office',
  impactSub:'Impact = how much the office average would change without your ratings. <b>Negative</b> means your ratings pull the office average down.',
  hOffice:'Office', hRating:'Rating', hYour:'Your rating', hOfficeAvg:'Office avg', hGap:'Gap', hShare:'Share of office ratings', hImpact:'Impact', hImpactTip:'Change in the office average if your ratings were removed', hRatings:'Ratings',
  lowTitle:'Houses with low ratings', lowSub:'Stays rated 3 or below in the selected period. Only the house ID is shown.', hHouse:'House ID', hLowCnt:'Low ratings', hLowAvg:'Avg of low', hLast:'Latest', hIssuesShort:'Issues reported', lowNone:'No low-rated stays in this period. 🎉', lowMore:'Showing {n} of {t} houses.',
  lowUnit:'low ratings',
  issuesTitle:'Cleaning issues', issuesSub:'What guests reported most often.', hIssue:'Issue', hCount:'Count', hShareIssues:'Share of issues',
  teamN:'{n} team members', clickSort:'Click a column to sort.', hMember:'Team member', hIssues:'Issues', more:'Show more ({n} remaining)',
  noMatch:'No match found for that Breezeway ID.', enter:'Enter your Breezeway ID above to see your rating.', noneVendor:'No ratings for this Breezeway ID in the selected period.',
  none:'No ratings in the selected period.', err:'Could not load the rating data. Please try again later.',
  note:'Rating = average guest cleaning rating (1–5) for stays with an arrival date in the selected period. Issue % = share of all reported issues.',
  issueLabels:["No Cleaning Issues","Windows inside not clean","Grill not clean","Annex not clean","Dirty floor","Bathroom not clean","Mold issues","Kitchen not cleaned","Refrigerator not clean","Oven not clean","Microwave not clean","Dishwasher not clean","Others"],
  short:["No issues","Windows","Grill","Annex","Floor","Bathroom","Mold","Kitchen","Fridge","Oven","Microwave","Dishwasher","Others"], loc:'en-GB' },
 da:{ title:'Nord – rengøringsvurderinger', tabVendor:'Firma', tabTeam:'Team', from:'Fra', to:'Til', office:'Lokalt kontor', allOffices:'Alle kontorer',
  typeSearch:'Skriv for at søge…', searchTeam:'Søg teammedlem', typeName:'Skriv et navn…',
  p7:'Seneste 7 dage', p30:'Seneste 30 dage', pMonth:'Denne måned', pLast:'Sidste måned', pAll:'Alle data',
  sub:'Gæsternes rengøringsvurderinger · data til {d} · opdateret {u}',
  kRating:'Din gennemsnitlige vurdering', kRatings:'Modtagne vurderinger', kIssues:'Rapporterede problemer', kNoIssues:'Ophold uden problemer',
  inOffice1:'i {n} kontor', inOffices:'i {n} kontorer', perRating:'{x} pr. vurdering', ofRatings:'{p} af vurderingerne', vsOffice:'i forhold til kontorets gennemsnit',
  impactTitle:'Din effekt på hvert kontor', byOffice:'Pr. kontor',
  impactSub:'Effekt = hvor meget kontorets gennemsnit ville ændre sig uden dine vurderinger. <b>Negativ</b> betyder, at dine vurderinger trækker kontorets gennemsnit ned.',
  hOffice:'Kontor', hRating:'Vurdering', hYour:'Din vurdering', hOfficeAvg:'Kontor gns.', hGap:'Forskel', hShare:'Andel af kontorets vurderinger', hImpact:'Effekt', hImpactTip:'Ændring i kontorets gennemsnit, hvis dine vurderinger blev fjernet', hRatings:'Vurderinger',
  lowTitle:'Huse med lave vurderinger', lowSub:'Ophold vurderet 3 eller lavere i den valgte periode. Kun hus-ID vises.', hHouse:'Hus-ID', hLowCnt:'Lave vurd.', hLowAvg:'Gns. af lave', hLast:'Seneste', hIssuesShort:'Rapporterede problemer', lowNone:'Ingen lavt vurderede ophold i perioden. 🎉', lowMore:'Viser {n} af {t} huse.',
  lowUnit:'lave vurderinger',
  issuesTitle:'Rengøringsproblemer', issuesSub:'Hvad gæsterne oftest har rapporteret.', hIssue:'Problem', hCount:'Antal', hShareIssues:'Andel af problemer',
  teamN:'{n} teammedlemmer', clickSort:'Klik på en kolonne for at sortere.', hMember:'Teammedlem', hIssues:'Problemer', more:'Vis flere ({n} tilbage)',
  noMatch:'Ingen match for dette Breezeway ID.', enter:'Indtast dit Breezeway ID ovenfor for at se din vurdering.', noneVendor:'Ingen vurderinger for dette Breezeway ID i den valgte periode.',
  none:'Ingen vurderinger i den valgte periode.', err:'Kunne ikke indlæse vurderingsdata. Prøv igen senere.',
  note:'Vurdering = gennemsnit af gæsternes rengøringsvurdering (1–5) for ophold med ankomstdato i den valgte periode. Problem-% = andel af alle rapporterede problemer.',
  issueLabels:["Ingen rengøringsproblemer","Vinduer indvendigt ikke rene","Grill ikke ren","Anneks ikke rent","Snavset gulv","Badeværelse ikke rent","Skimmelproblemer","Køkken ikke gjort rent","Køleskab ikke rent","Ovn ikke ren","Mikroovn ikke ren","Opvaskemaskine ikke ren","Andet"],
  short:["Ingen problemer","Vinduer","Grill","Anneks","Gulv","Badeværelse","Skimmel","Køkken","Køleskab","Ovn","Mikroovn","Opvaskemaskine","Andet"], loc:'da-DK' }
};
let lang = 'en';
const t = (k,v) => { let s = I18N[lang][k] ?? I18N.en[k] ?? k; if (v) for (const [a,b] of Object.entries(v)) s = s.split('{'+a+'}').join(b); return s; };
const fmtN = (x,d=2) => { const s = x.toFixed(d); return lang==='da' ? s.replace('.',',') : s; };

let DS = {}, tab = 'vendor', sortKey = 'rating', sortDir = -1, shown = 300;

/* ---------- helpers ---------- */
const fmtD = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d = new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return fmtD(d); };
const avg = (sum,cnt) => cnt ? sum/cnt : null;
const signed = x => Math.abs(x)<0.005 ? fmtN(0) : (x>0?'+':'−')+fmtN(Math.abs(x));
const cls = x => x==null ? 'flat' : x>=0.005 ? 'up' : x<=-0.005 ? 'down' : 'flat';
function badge(r){
  if (r==null) return '<span class="r-na">–</span>';
  const c = r>=4.5?'r-good':r>=4?'r-ok':r>=3.5?'r-warn':'r-bad';
  return `<span class="badge ${c}">${fmtN(r)}</span>`;
}
const pct = x => x ? (x*100).toFixed(0)+'%' : '–';
const totalIssues = iss => { let t=0; for (let i=1;i<13;i++) t+=iss[i]; return t; };
const byName = (ds,n) => ds.names.findIndex(x => x.toLowerCase()===n.toLowerCase());
const SORTCOL = (k,l,left) => `<th data-k="${k}" class="${left?'l':''}" aria-sort="${sortKey===k?(sortDir>0?'ascending':'descending'):'none'}">${l}</th>`;

/* ---------- aggregation (same logic as the Excel AVERAGEIFS / SUMIFS) ---------- */
function aggregate(ds, from, to, officeIdx){
  const ok = ds.dates.map(d => d >= from && d <= to);
  const m = new Map();
  for (const r of ds.rows){
    if (!ok[r[0]]) continue;
    if (officeIdx >= 0 && r[1] !== officeIdx) continue;
    const key = r[1]+'|'+r[2];
    let a = m.get(key);
    if (!a){ a = {o:r[1], n:r[2], rsum:0, rcnt:0, iss:new Array(13).fill(0)}; m.set(key,a); }
    a.rsum += r[3]; a.rcnt += r[4];
    for (let i=0;i<13;i++) a.iss[i] += r[5+i];
  }
  return m;
}
function officeTotals(ds, from, to){            // office index -> {sum,cnt} over ALL vendors
  const m = new Map();
  for (const r of ds.ot||[]){
    const d = ds.dates[r[0]]; if (d<from||d>to) continue;
    const a = m.get(r[1]) || {sum:0,cnt:0}; a.sum+=r[2]; a.cnt+=r[3]; m.set(r[1],a);
  }
  return m;
}
/* impact = office avg - office avg without this vendor's ratings */
function impact(O, sum, cnt){
  if (!O || !O.cnt) return {oavg:null, gap:null, share:null, imp:null};
  const oavg = O.sum/O.cnt, rest = O.cnt-cnt;
  return {oavg, gap: cnt? sum/cnt-oavg : null, share: cnt/O.cnt, imp: rest>0 ? oavg-(O.sum-sum)/rest : null};
}

/* ---------- URL hash (so a vendor can bookmark / share their own link) ---------- */
const readHash = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)).entries());
function writeHash(){
  const p = new URLSearchParams(); p.set('tab', tab); p.set('lang', lang);
  if ($('#from').value) p.set('from', $('#from').value);
  if ($('#to').value) p.set('to', $('#to').value);
  if (tab==='team' && $('#office').value) p.set('office', $('#office').value);
  if (tab==='vendor' && $('#who').value) p.set('vendor', $('#who').value);
  history.replaceState(null,'','#'+p.toString());
}

/* ---------- UI ---------- */
function applyStatic(){
  document.documentElement.lang = lang;
  document.title = t('title');
  for (const el of document.querySelectorAll('[data-i18n]')) el.innerHTML = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
  $('#lEN').setAttribute('aria-pressed', lang==='en'); $('#lDA').setAttribute('aria-pressed', lang==='da');
  if (DS.vendor) $('#upd').textContent = t('sub',{d:DS.vendor.dates.at(-1), u:DS.vendor.updated});
}
function setLang(l){
  lang = l; try{ localStorage.setItem('lang', l); }catch(e){}
  applyStatic(); fillOffices(); render();
}
function setTab(x){
  tab = x;
  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', b.dataset.tab===x);
  $('#vendorBox').hidden = x!=='vendor';
  $('#officeBox').hidden = x!=='team';
  $('#teamBox').hidden = x!=='team';
  sortKey = 'rating'; sortDir = -1; shown = 300;
  fillOffices(); render();
}
function fillOffices(){
  const ds = DS.team, cur = $('#office').value;
  $('#office').innerHTML = `<option value="">${esc(t('allOffices'))}</option>` + ds.offices.map(o => `<option>${esc(o)}</option>`).join('');
  if (ds.offices.includes(cur)) $('#office').value = cur;
}
function fillVendors(){
  const ds = DS.vendor, from=$('#from').value, to=$('#to').value, seen = new Set();
  for (const r of ds.rows) if (ds.dates[r[0]]>=from && ds.dates[r[0]]<=to) seen.add(r[2]);
  $('#whoList').innerHTML = [...seen].map(i=>ds.names[i]).sort((a,b)=>a.localeCompare(b,'da')).map(n=>`<option value="${esc(n)}">`).join('');
}
function presets(){
  const max = DS.vendor.dates.at(-1), min = DS.vendor.dates[0];
  const mStart = max.slice(0,8)+'01', pm = addDays(mStart,-1);
  return [[t('p7'),addDays(max,-6),max],[t('p30'),addDays(max,-29),max],[t('pMonth'),mStart,max],
          [t('pLast'),pm.slice(0,8)+'01',pm],[t('pAll'),min,max]];
}
function drawChips(){
  const f=$('#from').value, to=$('#to').value;
  $('#chips').innerHTML = presets().map((p,i)=>`<button class="chip" data-i="${i}" aria-pressed="${p[1]===f&&p[2]===to}">${esc(p[0])}</button>`).join('');
}
function render(){
  writeHash(); drawChips();
  if (tab==='vendor'){ fillVendors(); renderVendor(); } else renderTeam();
}

/* ---------- vendor view ---------- */
function lowHouses(ds, ni, allow, from, to){
  const m = new Map();
  for (const r of ds.low||[]){
    if (r[2]!==ni) continue;
    const d = ds.dates[r[0]]; if (d<from||d>to) continue;
    if (allow && !allow.includes(r[1])) continue;
    const k = r[1]+'|'+r[3];
    let h = m.get(k); if (!h){ h={o:r[1],id:r[3],c:0,s:0,last:'',iss:new Array(13).fill(0)}; m.set(k,h); }
    h.c++; h.s+=r[4]; if (d>h.last) h.last=d;
    for (let b=0;b<12;b++) if (r[5] & (1<<b)) h.iss[b+1]++;
  }
  return [...m.values()].sort((a,b)=> b.c-a.c || a.s/a.c-b.s/b.c || b.last.localeCompare(a.last));
}
function lowPanel(ds, ni, allow, from, to){
  const L = lowHouses(ds, ni, allow, from, to), CAP = 1000, short = I18N[lang].short, unit = esc(t('lowUnit'));
  const body = L.slice(0,CAP).map(h=>{
    const is = h.iss.map((c,i)=>({c,i})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,3).map(x=>short[x.i]+(x.c>1?' ×'+x.c:'')).join(', ');
    return `<tr><td class="l"><b>${esc(h.id)}</b></td><td class="l">${esc(ds.offices[h.o])}</td><td data-l="${unit}">${h.c}</td><td>${badge(h.s/h.c)}</td><td>${esc(h.last)}</td><td class="l">${esc(is||'–')}</td></tr>`;
  }).join('');
  return `<div class="panel"><h2>${esc(t('lowTitle'))}</h2><p class="sub">${esc(t('lowSub'))}</p>`+
    (L.length ? `<div class="scroll"><table class="low"><thead><tr><th class="l">${esc(t('hHouse'))}</th><th class="l">${esc(t('hOffice'))}</th><th>${esc(t('hLowCnt'))}</th><th>${esc(t('hLowAvg'))}</th><th>${esc(t('hLast'))}</th><th class="l">${esc(t('hIssuesShort'))}</th></tr></thead><tbody>${body}</tbody></table></div>`+
      (L.length>CAP?`<p class="sub" style="margin-top:8px">${esc(t('lowMore',{n:CAP,t:L.length}))}</p>`:'') : `<p class="sub">${esc(t('lowNone'))}</p>`) + `</div>`;
}
function renderVendor(){
  const ds = DS.vendor, out = $('#out'), name = $('#who').value.trim();
  const ni = byName(ds,name), from=$('#from').value, to=$('#to').value;
  if (!name || ni<0){
    out.innerHTML = `<div class="panel empty">${esc(name?t('noMatch'):t('enter'))}</div>`; return;
  }
  const allow = ds.allowed && ds.allowed[ni];
  const m = aggregate(ds, from, to, -1);
  const mine = [...m.values()].filter(a => a.n===ni && a.rcnt>0 && (!allow || allow.includes(a.o)))
    .sort((a,b)=>ds.offices[a.o].localeCompare(ds.offices[b.o],'da'));
  if (!mine.length){ out.innerHTML = `<div class="panel empty">${esc(t('noneVendor'))}</div>`; return; }
  const OT = officeTotals(ds, from, to), hasOT = OT.size>0;
  const tot = {rsum:0,rcnt:0,iss:new Array(13).fill(0)}; let oS=0,oC=0;
  for (const a of mine){ tot.rsum+=a.rsum; tot.rcnt+=a.rcnt; a.iss.forEach((v,i)=>tot.iss[i]+=v); const O=OT.get(a.o); if(O){oS+=O.sum;oC+=O.cnt;} }
  const ti = totalIssues(tot.iss), myAvg = avg(tot.rsum,tot.rcnt), offAvg = avg(oS,oC);
  const gap = (myAvg!=null && offAvg!=null) ? myAvg-offAvg : null;
  const rows = mine.map(a => {
    const k = impact(OT.get(a.o), a.rsum, a.rcnt);
    return `<tr><td>${esc(ds.offices[a.o])}</td><td>${badge(avg(a.rsum,a.rcnt))}</td>${hasOT?`
      <td>${k.oavg==null?'–':fmtN(k.oavg)}</td><td class="hide-sm ${cls(k.gap)}">${k.gap==null?'–':signed(k.gap)}</td>
      <td class="hide-sm">${k.share==null?'–':pct(k.share)}</td><td class="${cls(k.imp)}">${k.imp==null?'–':signed(k.imp)}</td>`:''}
      <td>${a.rcnt}</td></tr>`;
  }).join('');
  const labels = I18N[lang].issueLabels;
  const issueRows = labels.slice(1).map((l,i)=>({l,c:tot.iss[i+1]})).sort((a,b)=>b.c-a.c).map(x=>{
    const p = ti ? x.c/ti : 0;
    return `<tr><td>${esc(x.l)}</td><td>${x.c}</td><td><div class="bar"><div class="track"><div class="fill" style="width:${(p*100).toFixed(1)}%"></div></div><span style="min-width:36px;text-align:right">${pct(p)}</span></div></td></tr>`;
  }).join('');
  out.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="l">${esc(t('kRating'))}</div><div class="v">${badge(myAvg)}</div>
        <div class="s">${gap==null?'&nbsp;':`<span class="${cls(gap)}">${signed(gap)}</span> ${esc(t('vsOffice'))}`}</div></div>
      <div class="kpi"><div class="l">${esc(t('kRatings'))}</div><div class="v">${tot.rcnt}</div><div class="s">${esc(t(mine.length>1?'inOffices':'inOffice1',{n:mine.length}))}</div></div>
      <div class="kpi"><div class="l">${esc(t('kIssues'))}</div><div class="v">${ti}</div><div class="s">${esc(t('perRating',{x:fmtN(tot.rcnt?ti/tot.rcnt:0,1)}))}</div></div>
      <div class="kpi"><div class="l">${esc(t('kNoIssues'))}</div><div class="v">${tot.iss[0]}</div><div class="s">${esc(t('ofRatings',{p:pct(tot.rcnt?tot.iss[0]/tot.rcnt:0)}))}</div></div>
    </div>
    <div class="panel"><h2>${esc(hasOT?t('impactTitle'):t('byOffice'))}</h2>
      ${hasOT?`<p class="sub">${t('impactSub')}</p>`:''}
      <div class="scroll"><table><thead><tr><th class="l">${esc(t('hOffice'))}</th><th>${esc(t('hYour'))}</th>${hasOT?`<th>${esc(t('hOfficeAvg'))}</th><th class="hide-sm">${esc(t('hGap'))}</th><th class="hide-sm">${esc(t('hShare'))}</th><th title="${esc(t('hImpactTip'))}">${esc(t('hImpact'))}</th>`:''}<th>${esc(t('hRatings'))}</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    ${ds.low?lowPanel(ds, ni, allow, from, to):''}
    <div class="panel"><h2>${esc(t('issuesTitle'))}</h2><p class="sub">${esc(t('issuesSub'))}</p><div class="scroll"><table class="issues">
      <thead><tr><th class="l">${esc(t('hIssue'))}</th><th>${esc(t('hCount'))}</th><th class="l">${esc(t('hShareIssues'))}</th></tr></thead><tbody>${issueRows}</tbody></table></div></div>`;
}

/* ---------- team view ---------- */
function renderTeam(){
  const ds = DS.team, out = $('#out');
  const oi = $('#office').value ? ds.offices.indexOf($('#office').value) : -1, q = $('#q').value.trim().toLowerCase();
  const list = [...aggregate(ds,$('#from').value,$('#to').value,oi).values()].map(a=>{
    const ti = totalIssues(a.iss);
    const r = {office:ds.offices[a.o], name:ds.names[a.n], rating:avg(a.rsum,a.rcnt), rcnt:a.rcnt, ti};
    a.iss.slice(1).forEach((v,i)=>r['i'+i]=ti?v/ti:0); return r;
  }).filter(r=>r.rcnt>0 && (!q || r.name.toLowerCase().includes(q)));
  const get = r => r[sortKey]==null ? -Infinity : r[sortKey];
  list.sort((a,b)=>{ const x=get(a), y=get(b); const c = typeof x==='string' ? x.localeCompare(y,'da') : (x===y?0:x-y); return c*sortDir || a.name.localeCompare(b.name,'da'); });
  if (!list.length){ out.innerHTML = `<div class="panel empty">${esc(t('none'))}</div>`; return; }
  const short = I18N[lang].short;
  const head = SORTCOL('office',esc(t('hOffice')),1)+SORTCOL('name',esc(t('hMember')),1)+SORTCOL('rating',esc(t('hRating')))+SORTCOL('rcnt',esc(t('hRatings')))+SORTCOL('ti',esc(t('hIssues')))+short.slice(1).map((l,i)=>SORTCOL('i'+i,esc(l)+' %')).join('');
  const body = list.slice(0,shown).map(r=>`<tr><td>${esc(r.office)}</td><td class="l">${esc(r.name)}</td><td>${badge(r.rating)}</td><td>${r.rcnt}</td><td>${r.ti}</td>${
    short.slice(1).map((_,i)=>`<td class="${r['i'+i]?'':'muted'}">${pct(r['i'+i])}</td>`).join('')}</tr>`).join('');
  out.innerHTML = `<div class="panel"><h2>${esc(t('teamN',{n:list.length}))}</h2><p class="sub">${esc(t('clickSort'))}</p><div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${
    list.length>shown?`<button class="chip more" id="more">${esc(t('more',{n:list.length-shown}))}</button>`:''}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.id==='lEN') return setLang('en');
  if (e.target.id==='lDA') return setLang('da');
  const tb = e.target.closest('.tab'); if (tb) return setTab(tb.dataset.tab);
  const c = e.target.closest('.chip[data-i]');
  if (c){ const p = presets()[+c.dataset.i]; $('#from').value=p[1]; $('#to').value=p[2]; shown=300; return render(); }
  if (e.target.id==='more'){ shown += 300; return render(); }
  const h = e.target.closest('th[data-k]');
  if (h){ const k=h.dataset.k; if (sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=(k==='office'||k==='name')?1:-1; } render(); }
});
for (const id of ['from','to','office','who','q']) $('#'+id).addEventListener('input', () => { shown=300; render(); });

/* ---------- init ---------- */
(async function(){
  const h = readHash();
  let saved = null; try{ saved = localStorage.getItem('lang'); }catch(e){}
  lang = ['en','da'].includes(h.lang) ? h.lang : ['en','da'].includes(saved) ? saved : ((navigator.language||'').toLowerCase().startsWith('da') ? 'da' : 'en');
  applyStatic();
  try{
    const [v,tm] = await Promise.all(['vendors','teams'].map(f => fetch(`${f}.json`,{cache:'no-cache'}).then(r=>{ if(!r.ok) throw 0; return r.json(); })));
    DS = {vendor:v, team:tm};
  }catch(e){
    $('#out').innerHTML = `<div class="panel empty">${esc(t('err'))}</div>`; $('#upd').textContent=''; return;
  }
  const p = presets()[1];
  $('#from').value = h.from || p[1]; $('#to').value = h.to || p[2];
  $('#from').min = $('#to').min = DS.vendor.dates[0]; $('#from').max = $('#to').max = DS.vendor.dates.at(-1);
  applyStatic();
  if (h.vendor) $('#who').value = h.vendor;
  fillOffices(); if (h.office) $('#office').value = h.office;
  setTab(h.tab==='team' ? 'team' : 'vendor');
})();
</script>
